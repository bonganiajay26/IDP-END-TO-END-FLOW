name: service-ci

on:
  pull_request:
    paths:
      - "sample-service/**"
      - ".github/workflows/service-ci.yml"
  push:
    branches: [main]
    paths:
      - "sample-service/**"
      - ".github/workflows/service-ci.yml"

permissions:
  contents: write
  id-token: write

concurrency:
  group: sample-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sample-service/requirements.txt

      - name: Install dependencies
        run: pip install -r sample-service/requirements.txt

      - name: Unit tests
        working-directory: sample-service
        run: pytest -q

      - name: Build image
        run: docker build -t sample-api:${GITHUB_SHA} sample-service

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: sample-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push immutable image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag sample-api:${IMAGE_TAG} ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
          docker push ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
          echo "IMAGE_URI=${REGISTRY}/${REPOSITORY}" >> "$GITHUB_ENV"

      - name: Update GitOps desired state
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("gitops/apps/sample-api/overlays/dev/kustomization.yaml")
          text = p.read_text()
          lines = text.splitlines()
          out=[]
          for line in lines:
              if line.strip().startswith("newName:"):
                  out.append(f"    newName: {__import__('os').environ['IMAGE_URI']}")
              elif line.strip().startswith("newTag:"):
                  out.append(f"    newTag: {__import__('os').environ['IMAGE_TAG']}")
              else:
                  out.append(line)
          p.write_text("\n".join(out) + "\n")
          PY

      - name: Commit GitOps update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/sample-api/overlays/dev/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No GitOps change to commit"
            exit 0
          fi
          git commit -m "deploy(sample-api): ${GITHUB_SHA} [skip ci]"
          git push
